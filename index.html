<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Digital Storytelling Gallery</title>
<style>
  :root {
    --bg: #f7f3ea;
    --card: #fffdf8;
    --ink: #1f2430;
    --muted: #5d6472;
    --line: #e2dccd;
    --accent: #003e7e;
    --flag: #2e8b3e;
    --stop: #c0392b;
    --overlay: rgba(20, 22, 28, 0.92);
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17191f; --card: #22252d; --ink: #eef0f4; --muted: #a7adb9;
      --line: #343844; --accent: #8db8ea; --overlay: rgba(0,0,0,.85);
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #17191f; --card: #22252d; --ink: #eef0f4; --muted: #a7adb9;
    --line: #343844; --accent: #8db8ea; --overlay: rgba(0,0,0,.85);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.3);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header { max-width: 1200px; margin: 0 auto; padding: 40px 16px 8px; }
  h1 { font: 600 clamp(28px, 4vw, 40px)/1.15 Georgia, "Times New Roman", serif; margin: 0 0 6px; }
  header p { margin: 0; color: var(--muted); }
  main {
    max-width: 1200px; margin: 0 auto; padding: 24px 16px 56px;
    display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  }
  .card {
    all: unset; cursor: pointer; display: block; background: var(--card);
    border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
    box-shadow: var(--shadow); transition: transform .12s ease;
  }
  .card:hover { transform: translateY(-2px); }
  .card:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .thumb { aspect-ratio: 4 / 3; width: 100%; display: block; background: #fff; object-fit: cover; }
  .name { padding: 10px 14px 12px; font-weight: 600; font-size: 17px; display: flex; align-items: center; gap: 8px; }
  #lock { max-width: 1200px; margin: 0 auto; padding: 24px 16px 56px; }
  #lock label { display: block; font-weight: 600; margin-bottom: 6px; }
  .lockrow { display: flex; gap: 8px; flex-wrap: wrap; }
  #pw { font: 16px system-ui, sans-serif; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); width: min(320px, 100%); }
  .go2 { font: 600 16px system-ui, sans-serif; padding: 10px 16px; border: 0; border-radius: 8px; background: var(--accent); color: var(--bg); cursor: pointer; }
  #lockmsg { color: var(--stop); min-height: 1.5em; margin: 8px 0 0; }
  main[hidden], #lock[hidden] { display: none; }
  .card.soon { cursor: default; }
  .card.soon:hover { transform: none; }
  .soon-art {
    display: flex; align-items: center; justify-content: center;
    background: repeating-linear-gradient(135deg, var(--bg) 0 14px, var(--card) 14px 28px);
    border-bottom: 1px dashed var(--line);
  }
  .soon-art span {
    font: italic 600 20px/1 Georgia, serif; color: var(--muted);
    padding: 8px 14px; border: 2px dashed var(--line); border-radius: 999px; background: var(--card);
  }
  .card.soon .name { color: var(--muted); }
  .card.soon .name::before { border-left-color: var(--line); }
  .name::before { content: ""; width: 0; height: 0; border-left: 9px solid var(--flag); border-top: 6px solid transparent; border-bottom: 6px solid transparent; }

  dialog {
    border: 0; padding: 0; background: transparent; max-width: 100vw; max-height: 100vh;
    width: 100vw; height: 100vh; color: #fff;
  }
  dialog::backdrop { background: var(--overlay); }
  .shell { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; gap: 12px; }
  .bar { width: min(960px, 100%); display: flex; align-items: center; gap: 8px; }
  .bar h2 { flex: 1; margin: 0; font: 600 22px/1.2 Georgia, serif; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .btn {
    border: 0; border-radius: 8px; padding: 8px 12px; font: 600 15px system-ui, sans-serif;
    background: rgba(255,255,255,.14); color: #fff; cursor: pointer; min-height: 40px;
  }
  .btn:hover { background: rgba(255,255,255,.24); }
  .btn.go { background: var(--flag); }
  .btn.stop { background: var(--stop); }
  #stage {
    width: min(960px, 100%, calc((100vh - 140px) * 4 / 3));
    aspect-ratio: 4 / 3; background: #fff; border-radius: 8px; overflow: hidden; position: relative;
  }
  #status {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #333; background: #fff; font-weight: 600; z-index: 5;
  }
  #status[hidden] { display: none; }
  .hint { color: rgba(255,255,255,.7); font-size: 14px; margin: 0; }
  @media (max-width: 560px) { .btn .lbl { display: none; } }
</style>
</head>
<body>
<header>
  <h1>Digital Storytelling Gallery</h1>
  <p>Grade 6 Computer Science, Unit 1 projects made in Scratch. Click a project to play it.</p>
</header>
<form id="lock" autocomplete="off">
  <label for="pw">Password</label>
  <div class="lockrow">
    <input id="pw" type="password" autocomplete="current-password" required>
    <button class="go2" type="submit">Open gallery</button>
  </div>
  <p id="lockmsg" role="alert"></p>
</form>
<main id="grid" aria-label="Projects" hidden></main>

<dialog id="player" aria-labelledby="who">
  <div class="shell">
    <div class="bar">
      <h2 id="who"></h2>
      <button class="btn" id="prev" title="Previous project">&larr;<span class="lbl"> Prev</span></button>
      <button class="btn" id="next" title="Next project"><span class="lbl">Next </span>&rarr;</button>
      <button class="btn go" id="go" title="Start (green flag)">&#9873;<span class="lbl"> Start</span></button>
      <button class="btn stop" id="stop" title="Stop">&#9632;<span class="lbl"> Stop</span></button>
      <button class="btn" id="close" title="Back to gallery">&#10005;<span class="lbl"> Close</span></button>
    </div>
    <div id="stage"><div id="status">Loading&hellip;</div></div>
    <p class="hint">Click the stage first if the project uses the keyboard.</p>
  </div>
</dialog>

<script src="player/scaffolding-min.js"></script>
<script>
(async () => {
  const grid = document.getElementById('grid');
  const dlg = document.getElementById('player');
  const who = document.getElementById('who');
  const status = document.getElementById('status');
  const projects = [];
  const lock = document.getElementById('lock');
  const lockmsg = document.getElementById('lockmsg');
  const meta = await (await fetch('lock.json', { cache: 'no-cache' })).json();
  const b64 = (str) => Uint8Array.from(atob(str), (c) => c.charCodeAt(0));
  let key = null;

  async function deriveKey(pw) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(meta.salt), iterations: meta.iterations, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
  }
  async function getFile(path) {
    const buf = new Uint8Array(await (await fetch(path, { cache: 'no-cache' })).arrayBuffer());
    try {
      const out = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(0, 12) }, key, buf.slice(12));
      try { sessionStorage.removeItem('staleReload'); } catch (_) {}
      return out;
    } catch (e) {
      if (lock.hidden) {
        let again = false;
        try { again = !sessionStorage.getItem('staleReload'); sessionStorage.setItem('staleReload', '1'); sessionStorage.removeItem('galleryKey'); } catch (_) {}
        if (again) location.reload();
      }
      throw e;
    }
  }
  async function unlock(k) {
    key = k;
    const all = JSON.parse(new TextDecoder().decode(await getFile('data.bin')));
    try { sessionStorage.setItem('galleryKey', JSON.stringify(await crypto.subtle.exportKey('jwk', k))); } catch (e) {}
    lock.hidden = true; grid.hidden = false;
    build(all);
  }
  lock.addEventListener('submit', async (e) => {
    e.preventDefault();
    lockmsg.textContent = 'Checking\u2026';
    try { await unlock(await deriveKey(document.getElementById('pw').value)); lockmsg.textContent = ''; }
    catch (err) { lockmsg.textContent = 'That password did not work. Try again.'; }
  });
  try {
    const saved = sessionStorage.getItem('galleryKey');
    if (saved) await unlock(await crypto.subtle.importKey('jwk', JSON.parse(saved), { name: 'AES-GCM' }, true, ['decrypt']));
  } catch (e) { key = null; }

  function build(all) {
  all.forEach((p) => {
    if (!p.key) {
      const d = document.createElement('div');
      d.className = 'card soon';
      d.innerHTML = `<div class="thumb soon-art"><span>Coming soon</span></div><div class="name"></div>`;
      d.querySelector('.name').textContent = p.name;
      grid.appendChild(d);
      return;
    }
    const i = projects.length;
    projects.push(p);
    const b = document.createElement('button');
    b.className = 'card';
    b.innerHTML = `<img class="thumb" alt=""><div class="name"></div>`;
    getFile(`thumbs/${p.key}.bin`).then((d) => { b.querySelector('img').src = URL.createObjectURL(new Blob([d], { type: 'image/jpeg' })); }).catch(() => {});
    b.querySelector('.name').textContent = p.name;
    b.setAttribute('aria-label', `Play ${p.name}'s project`);
    b.addEventListener('click', () => open(i));
    grid.appendChild(b);
  });
  }

  let sc = null, current = -1, loadToken = 0;
  function ensurePlayer() {
    if (sc) return sc;
    sc = new Scaffolding.Scaffolding();
    sc.width = 480; sc.height = 360; sc.resizeMode = 'preserve-ratio';
    sc.setup();
    sc.appendTo(document.getElementById('stage'));
    return sc;
  }

  async function open(i) {
    current = (i + projects.length) % projects.length;
    const p = projects[current];
    who.textContent = p.name;
    if (!dlg.open) dlg.showModal();
    const s = ensurePlayer();
    s.stopAll();
    status.hidden = false; status.textContent = 'Loading…';
    const token = ++loadToken;
    try {
      const data = await getFile(`projects/${p.key}.bin`);
      if (token !== loadToken) return;
      await s.loadProject(data);
      if (token !== loadToken) return;
      s.relayout();
      status.hidden = true;
      releaseFocus();
      s.start();
      s.greenFlag();
    } catch (e) {
      if (token !== loadToken) return;
      console.error(e);
      if (e && e.name === 'OperationError') {
        try { sessionStorage.removeItem('galleryKey'); } catch (_) {}
        status.textContent = 'This gallery was just updated. Reload the page and enter the password again.';
      } else {
        status.textContent = 'This project could not be loaded.';
      }
    }
  }

  // The player only hears keys whose target is the page body, but inside the popup focus sits on a
  // button or the popup itself. Release focus so keys reach the game, and forward any that still miss.
  function releaseFocus() {
    const a = document.activeElement;
    if (a && a !== document.body && a.tagName !== 'INPUT' && a.tagName !== 'TEXTAREA') a.blur();
  }
  dlg.addEventListener('pointerdown', (e) => {
    if (!e.target.closest('button, input, textarea')) setTimeout(releaseFocus, 0);
  });
  dlg.addEventListener('click', (e) => { if (e.target.closest('button')) setTimeout(releaseFocus, 0); });
  document.addEventListener('keydown', (e) => {
    if (!dlg.open || !sc) return;
    const t = e.target;
    if (t === document || t === document.body) return; // the player handles these itself
    if (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA') return; // typing an answer
    if (t.tagName === 'BUTTON' && (e.key === ' ' || e.key === 'Enter')) return; // keyboard use of the toolbar
    if (e.key === 'Escape') return;
    sc.vm.postIOData('keyboard', { key: e.key, keyCode: e.keyCode, isDown: true });
    if ([32, 37, 38, 39, 40, 8, 222, 191].includes(e.keyCode)) e.preventDefault();
  }, true);

  document.getElementById('go').onclick = () => sc && sc.greenFlag();
  document.getElementById('stop').onclick = () => sc && sc.stopAll();
  document.getElementById('prev').onclick = () => open(current - 1);
  document.getElementById('next').onclick = () => open(current + 1);
  document.getElementById('close').onclick = () => dlg.close();
  dlg.addEventListener('close', () => { loadToken++; if (sc) sc.stopAll(); });
  dlg.addEventListener('cancel', (e) => { e.preventDefault(); dlg.close(); });
  window.addEventListener('resize', () => sc && sc.relayout());
})();
</script>
</body>
</html>
